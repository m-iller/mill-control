[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "millrepair"
dynamic = ["version"]
description = "Мониторинг и окно капитального ремонта барабанной шаровой мельницы"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mill Repair Window" }]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyinstaller>=6.0",
]

[project.scripts]
millrepair = "millrepair.__main__:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/millrepair/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/millrepair"]

[tool.hatch.build.targets.sdist]
include = [
    "src/millrepair",
    "seed/default_model.json",
    "README.md",
    "CHANGELOG.md",
    "justfile",
    "Makefile",
    "packaging",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: оптимизатор, интерфейс и прочие тесты дольше пары секунд",
]
addopts = ["-ra"]

[tool.coverage.run]
source = ["millrepair"]
omit = [
    "*/millrepair/ui/*",
    "*/millrepair/_version.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/millrepair/_version.py", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
